name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: local.properties
      run: |
        echo "LASTFM_API_KEY=" > local.properties
        echo "LASTFM_SECRET=" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=" >> local.properties
    # Reuse the same debug key as the Check workflow, so this APK can update an
    # existing Dev install instead of being rejected for a different signature.
    - name: Write the debug keystore
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
        mkdir -p ~/.android
        echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
    - run: chmod +x gradlew
    - name: Run phone unit tests
      run: ./gradlew testDevDebugUnitTest
    - name: Run shared JVM tests
      run: ./gradlew :shared:jvmTest
    - name: Build the phone Dev APK
      run: ./gradlew :app:assembleDevDebug
    - name: Upload the phone Dev APK
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk
